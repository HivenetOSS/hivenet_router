version: 2
updates:
  # Go module dependencies (go.mod / go.sum).
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # Bundle non-major bumps into a single PR to reduce review noise.
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  # Versions of the actions used in .github/workflows/*.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
    groups:
      github-actions:
        patterns:
          - "*"
