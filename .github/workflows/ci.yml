name: CI

# Runs on every PR and on pushes to main. The `test` job is the required
# status check enforced by branch protection (see scripts/setup-branch-protection.sh).
# A PR that changes only files under docs/ skips the Go jobs: a skipped job
# counts as passed for a required check, so the PR can still merge.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # go-nvml (agent) and the -race detector both require cgo. ubuntu-latest ships gcc.
  CGO_ENABLED: "1"

jobs:
  changes:
    # code=false only for a PR whose files are all under docs/. Pushes to main
    # always run everything. Top-level and test/ Markdown stays "code": tests
    # read test/isolation/CHECKLIST.md.
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          code=true
          if [ "$EVENT" = "pull_request" ]; then
            files="$(git diff --name-only "$BASE...$HEAD")"
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qv '^docs/'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code"

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test ./... -race -count=1

  smoke:
    # Binary-level end-to-end: builds the real router + agent binaries, wires
    # them to a stub OpenAI backend, and drives an inference request through
    # the router's HTTP API. Complements the in-process test/e2e suite by
    # exercising the cmd/ flag surface and startup wiring the test bypasses.
    name: e2e smoke
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run smoke script
        run: ./scripts/e2e-smoke.sh

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Enforce gofmt formatting (uses the toolchain's own gofmt for an exact match).
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted. Run 'gofmt -w .':"
            echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned for reproducible CI; bump intentionally (v2 matches .golangci.yml).
          # v2.15.0: first version that decodes Go 1.27.3 export data.
          version: v2.15.0

  govulncheck:
    name: govulncheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Scans dependencies against the Go vulnerability database and fails on any
      # reachable vulnerability that is not explicitly allowlisted in the script.
      - name: Run govulncheck
        run: ./scripts/govulncheck.sh

  license-check:
    name: license-check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Fails if a dependency introduces a license incompatible with shipping
      # Hivenet Router's static binaries under Apache 2.0 (GPL/LGPL/AGPL/unknown).
      - name: Check dependency licenses
        run: ./scripts/check-licenses.sh
